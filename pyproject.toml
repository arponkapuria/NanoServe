[project]
name = "nanoserve"
version = "0.1.0"
description = "From-scratch mini LLM inference engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "transformers>=4.45",
    "accelerate>=0.34",
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanoserve"]
